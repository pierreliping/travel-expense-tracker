<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>旅行费用记账单</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8e0ea;
      --soft: #eef5ff;
      --primary: #1769d1;
      --primary-dark: #0f4f9f;
      --danger: #b42318;
      --green: #0f8b5f;
      --orange: #c2410c;
      --purple: #6d28d9;
      --shadow: 0 10px 26px rgba(27, 38, 59, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px;
    }

    .topbar {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 46px;
      padding: 10px 12px;
      background: var(--card);
      color: var(--ink);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(27, 38, 59, 0.04);
    }

    .btn.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn.danger {
      color: var(--danger);
    }

    .layout {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-title {
      margin: 0;
      padding: 14px 14px 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    form {
      padding: 14px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      max-width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
    }

    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
      padding-right: 10px;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23, 105, 209, 0.12);
    }

    .quick-cats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .quick-cat {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #334155;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .quick-cat.active {
      border-color: var(--primary);
      background: var(--soft);
      color: var(--primary-dark);
    }

    .form-actions {
      position: sticky;
      bottom: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px -14px -14px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 14px;
    }

    .metric {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fbfcff;
      padding: 12px;
    }

    .metric.total {
      grid-column: 1 / -1;
      background: var(--soft);
      border-color: #bfd6ff;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric-value {
      margin-top: 4px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .metric.total .metric-value {
      color: var(--primary-dark);
      font-size: 26px;
    }

    .stats-cards {
      display: grid;
      gap: 8px;
      padding: 0 14px 14px;
    }

    .stat-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 10px;
    }

    .stat-main {
      min-width: 0;
    }

    .stat-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .stat-amount {
      color: var(--primary-dark);
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }

    .filters {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fbfcff;
    }

    .cards {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .expense-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px;
    }

    .expense-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .expense-date {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .expense-amount {
      color: var(--primary-dark);
      font-size: 20px;
      font-weight: 900;
      white-space: nowrap;
    }

    .expense-reason {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .expense-meta {
      display: grid;
      gap: 5px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .expense-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .expense-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .small-btn {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #334155;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .food { background: #e8f5ee; color: var(--green); }
    .hotel { background: #eef5ff; color: var(--primary-dark); }
    .fuel { background: #fff7ed; color: var(--orange); }
    .shopping { background: #f5efff; color: var(--purple); }
    .ticket { background: #e0f2fe; color: #0369a1; }
    .cablecar { background: #ecfccb; color: #4d7c0f; }
    .guide { background: #ffe4e6; color: #be123c; }
    .shuttle { background: #ede9fe; color: #5b21b6; }
    .tip { background: #fef3c7; color: #92400e; }
    .toll { background: #fef9c3; color: #a16207; }

    .desktop-table-wrap {
      display: none;
      overflow: auto;
      max-height: 70vh;
    }

    table {
      width: 100%;
      min-width: 1500px;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px 9px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      background: #f3f6fb;
      color: #334155;
      font-size: 12px;
      white-space: nowrap;
    }

    .amount {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      padding: 22px 14px;
      color: var(--muted);
      text-align: center;
    }

    .file-input {
      display: none;
    }

    @media (min-width: 760px) {
      .app {
        padding: 22px;
      }

      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
      }

      h1 {
        font-size: 32px;
      }

      .toolbar {
        grid-template-columns: repeat(5, auto);
      }

      .layout {
        grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
        align-items: start;
      }

      .form-grid,
      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .full {
        grid-column: 1 / -1;
      }

      .quick-cats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .summary {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .metric.total {
        grid-column: auto;
      }

      .stats-cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1080px) {
      .cards {
        display: none;
      }

      .desktop-table-wrap {
        display: block;
      }

      .stats-cards {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .toolbar,
      .entry-panel,
      .filters,
      .expense-actions {
        display: none;
      }

      .app {
        max-width: none;
        padding: 0;
      }

      .layout {
        display: block;
      }

      .panel {
        border: 0;
        box-shadow: none;
      }

      .cards {
        display: none;
      }

      .desktop-table-wrap {
        display: block;
        max-height: none;
      }

      th {
        position: static;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>旅行费用记账单</h1>
        <p class="subtitle">手机优先设计，数据保存在当前浏览器 localStorage，可导入/导出 JSON。</p>
      </div>
      <div class="toolbar" aria-label="工具栏">
        <button class="btn" id="exportCsvBtn" type="button">导出 CSV</button>
        <button class="btn" id="exportJsonBtn" type="button">导出 JSON</button>
        <button class="btn" id="importBtn" type="button">导入 JSON</button>
        <button class="btn" id="printBtn" type="button">打印</button>
        <button class="btn danger" id="clearBtn" type="button">清空</button>
        <input class="file-input" id="importFile" type="file" accept="application/json,.json">
      </div>
    </header>

    <section class="layout">
      <section class="panel entry-panel">
        <h2 class="panel-title" id="formTitle">新增开支</h2>
        <form id="expenseForm">
          <input id="editingId" type="hidden">
          <div class="form-grid">
            <label>
              日期
              <input id="date" type="date" required>
            </label>
            <label>
              分类
              <select id="category" required></select>
            </label>
            <div class="quick-cats full" id="quickCategoryButtons" aria-label="快捷分类"></div>
            <label>
              消费金额
              <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off" required>
            </label>
            <label>
              支付方式
              <select id="payment">
                <option value="微信">微信</option>
                <option value="支付宝">支付宝</option>
                <option value="银行卡">银行卡</option>
                <option value="现金">现金</option>
                <option value="其他">其他</option>
              </select>
            </label>
            <label class="full">
              开支事由
              <input id="reason" type="text" placeholder="例如：午餐、门票、高速通行、酒店入住">
            </label>
            <label>
              过路费起点
              <input id="from" type="text" placeholder="从哪">
            </label>
            <label>
              过路费终点
              <input id="to" type="text" placeholder="到哪">
            </label>
            <label>
              大约里程数（公里）
              <input id="mileage" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例如：128" autocomplete="off">
            </label>
            <label>
              票据编号/订单号
              <input id="receipt" type="text" placeholder="可选">
            </label>
            <label class="full">
              备注
              <textarea id="note" placeholder="同行人、发票情况、报销说明等"></textarea>
            </label>
          </div>
          <div class="form-actions">
            <button class="btn primary" id="saveBtn" type="submit">保存记录</button>
            <button class="btn" id="resetBtn" type="button">重置</button>
          </div>
          <p class="hint">提示：选择“过路费”时，建议填写起点、终点和大约里程数。</p>
        </form>
      </section>

      <section class="panel">
        <h2 class="panel-title">分类统计</h2>
        <div class="summary" id="summaryCards"></div>
        <div class="stats-cards" id="statsCards"></div>

        <div class="filters" aria-label="筛选条件">
          <label>
            关键词
            <input id="search" type="search" placeholder="搜索事由、路线、备注">
          </label>
          <label>
            分类筛选
            <select id="filterCategory"></select>
          </label>
          <label>
            开始日期
            <input id="startDate" type="date">
          </label>
          <label>
            结束日期
            <input id="endDate" type="date">
          </label>
        </div>

        <div class="cards" id="expenseCards" aria-label="手机开支明细"></div>
        <div class="desktop-table-wrap">
          <table aria-label="开支明细表">
            <thead>
              <tr id="tableHeadRow"></tr>
            </thead>
            <tbody id="expenseBody"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "travel-expense-tracker-v1";
    const categories = ["餐饮", "住宿", "加油", "购物", "门票", "缆车", "导游费", "景区内车费", "小费", "过路费", "其他消费"];
    const categoryClass = {
      "餐饮": "food",
      "住宿": "hotel",
      "加油": "fuel",
      "购物": "shopping",
      "门票": "ticket",
      "缆车": "cablecar",
      "导游费": "guide",
      "景区内车费": "shuttle",
      "小费": "tip",
      "过路费": "toll",
      "其他消费": ""
    };
    const tableHeaders = ["日期", "分类", "消费金额", ...categories, "开支事由", "从哪", "到哪", "大约里程数", "支付方式", "票据/订单", "备注", "操作"];

    const form = document.getElementById("expenseForm");
    const formTitle = document.getElementById("formTitle");
    const saveBtn = document.getElementById("saveBtn");
    const summaryCards = document.getElementById("summaryCards");
    const statsCards = document.getElementById("statsCards");
    const expenseCards = document.getElementById("expenseCards");
    const expenseBody = document.getElementById("expenseBody");
    const tableHeadRow = document.getElementById("tableHeadRow");
    const quickCategoryButtons = document.getElementById("quickCategoryButtons");

    const fields = {
      editingId: document.getElementById("editingId"),
      date: document.getElementById("date"),
      category: document.getElementById("category"),
      amount: document.getElementById("amount"),
      payment: document.getElementById("payment"),
      reason: document.getElementById("reason"),
      from: document.getElementById("from"),
      to: document.getElementById("to"),
      mileage: document.getElementById("mileage"),
      receipt: document.getElementById("receipt"),
      note: document.getElementById("note")
    };

    const filters = {
      search: document.getElementById("search"),
      category: document.getElementById("filterCategory"),
      startDate: document.getElementById("startDate"),
      endDate: document.getElementById("endDate")
    };

    let expenses = loadExpenses();

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function uid() {
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function money(value) {
      return Number(value || 0).toLocaleString("zh-CN", {
        style: "currency",
        currency: "CNY",
        minimumFractionDigits: 2
      });
    }

    function numberText(value) {
      const n = Number(value || 0);
      return n ? n.toLocaleString("zh-CN", { maximumFractionDigits: 1 }) : "";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function loadExpenses() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (error) {
        alert("读取本地数据失败，将以空白账单打开。");
        return [];
      }
    }

    function saveExpenses() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    }

    function initStaticUi() {
      fields.category.innerHTML = categories.map((category) => `<option value="${category}">${category}</option>`).join("");
      filters.category.innerHTML = `<option value="全部">全部</option>` + categories.map((category) => `<option value="${category}">${category}</option>`).join("");
      quickCategoryButtons.innerHTML = categories.map((category) => `<button class="quick-cat" type="button" data-category="${category}">${category}</button>`).join("");
      tableHeadRow.innerHTML = tableHeaders.map((header) => `<th class="${["消费金额", "大约里程数"].includes(header) || categories.includes(header) ? "amount" : ""}">${header}</th>`).join("");
    }

    function updateCategoryUi() {
      quickCategoryButtons.querySelectorAll(".quick-cat").forEach((button) => {
        button.classList.toggle("active", button.dataset.category === fields.category.value);
      });
      fields.reason.placeholder = fields.category.value === "过路费"
        ? "例如：高速通行费"
        : "例如：午餐、门票、高速通行、酒店入住";
    }

    function resetForm() {
      form.reset();
      fields.editingId.value = "";
      fields.date.value = today();
      fields.category.value = "餐饮";
      fields.payment.value = "微信";
      formTitle.textContent = "新增开支";
      saveBtn.textContent = "保存记录";
      updateCategoryUi();
    }

    function readForm() {
      const id = fields.editingId.value || uid();
      const previous = expenses.find((item) => item.id === id);
      return {
        id,
        date: fields.date.value,
        category: fields.category.value,
        amount: Number(fields.amount.value || 0),
        payment: fields.payment.value,
        reason: fields.reason.value.trim(),
        from: fields.from.value.trim(),
        to: fields.to.value.trim(),
        mileage: Number(fields.mileage.value || 0),
        receipt: fields.receipt.value.trim(),
        note: fields.note.value.trim(),
        createdAt: previous?.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function fillForm(item) {
      fields.editingId.value = item.id;
      fields.date.value = item.date || today();
      fields.category.value = item.category || "餐饮";
      fields.amount.value = item.amount ?? "";
      fields.payment.value = item.payment || "微信";
      fields.reason.value = item.reason || "";
      fields.from.value = item.from || "";
      fields.to.value = item.to || "";
      fields.mileage.value = item.mileage || "";
      fields.receipt.value = item.receipt || "";
      fields.note.value = item.note || "";
      formTitle.textContent = "编辑开支";
      saveBtn.textContent = "更新记录";
      updateCategoryUi();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function getFilteredExpenses() {
      const keyword = filters.search.value.trim().toLowerCase();
      const category = filters.category.value;
      const startDate = filters.startDate.value;
      const endDate = filters.endDate.value;

      return expenses
        .filter((item) => {
          if (category !== "全部" && item.category !== category) return false;
          if (startDate && item.date < startDate) return false;
          if (endDate && item.date > endDate) return false;
          if (!keyword) return true;
          const haystack = [item.date, item.category, item.amount, item.reason, item.from, item.to, item.mileage, item.payment, item.receipt, item.note]
            .join(" ")
            .toLowerCase();
          return haystack.includes(keyword);
        })
        .sort((a, b) => `${b.date}-${b.createdAt}`.localeCompare(`${a.date}-${a.createdAt}`));
    }

    function summarize(list) {
      const summary = Object.fromEntries(categories.map((category) => [category, { count: 0, total: 0 }]));
      let total = 0;
      let tollMileage = 0;

      list.forEach((item) => {
        const category = categories.includes(item.category) ? item.category : "其他消费";
        const amount = Number(item.amount || 0);
        summary[category].count += 1;
        summary[category].total += amount;
        total += amount;
        if (category === "过路费") tollMileage += Number(item.mileage || 0);
      });

      return { summary, total, tollMileage, count: list.length };
    }

    function renderSummary(list) {
      const { summary, total, tollMileage, count } = summarize(list);
      const dayCount = new Set(list.map((item) => item.date).filter(Boolean)).size;
      const metrics = [
        ["总开支", money(total), "total"],
        ["记录笔数", `${count} 笔`, ""],
        ["过路里程", `${numberText(tollMileage) || "0"} 公里`, ""],
        ["日均开支", money(dayCount ? total / dayCount : 0), ""]
      ];

      summaryCards.innerHTML = metrics.map(([label, value, className]) => `
        <div class="metric ${className}">
          <div class="metric-label">${label}</div>
          <div class="metric-value">${value}</div>
        </div>
      `).join("");

      statsCards.innerHTML = categories.map((category) => {
        const row = summary[category];
        const percent = total ? `${((row.total / total) * 100).toFixed(1)}%` : "0.0%";
        return `
          <article class="stat-card">
            <div class="stat-main">
              <span class="tag ${categoryClass[category]}">${category}</span>
              <div class="stat-meta">${row.count} 笔 · ${percent}</div>
            </div>
            <div class="stat-amount">${money(row.total)}</div>
          </article>
        `;
      }).join("");
    }

    function renderCards(list) {
      if (!list.length) {
        expenseCards.innerHTML = `<div class="empty">暂无记录，先添加一笔开支。</div>`;
        return;
      }

      expenseCards.innerHTML = list.map((item) => {
        const route = item.from || item.to ? `${item.from || "未填起点"} 到 ${item.to || "未填终点"}` : "";
        const meta = [
          ["支付", item.payment],
          ["路线", route],
          ["里程", item.mileage ? `${numberText(item.mileage)} 公里` : ""],
          ["票据", item.receipt]
        ].filter((entry) => entry[1]).map(([label, value]) => `<div>${label}：${escapeHtml(value)}</div>`).join("");

        return `
          <article class="expense-card">
            <div class="expense-card-head">
              <div>
                <div class="expense-date">${escapeHtml(item.date)}</div>
                <span class="tag ${categoryClass[item.category] || ""}">${escapeHtml(item.category)}</span>
              </div>
              <div class="expense-amount">${money(item.amount)}</div>
            </div>
            <div class="expense-reason">${escapeHtml(item.reason || "未填写事由")}</div>
            ${meta ? `<div class="expense-meta">${meta}</div>` : ""}
            ${item.note ? `<div class="expense-note">${escapeHtml(item.note)}</div>` : ""}
            <div class="expense-actions">
              <button class="small-btn" type="button" data-action="edit" data-id="${item.id}">编辑</button>
              <button class="small-btn" type="button" data-action="delete" data-id="${item.id}">删除</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderTable(list) {
      expenseBody.innerHTML = list.map((item) => {
        const categoryColumns = categories.map((category) => `<td class="amount">${item.category === category ? money(item.amount) : ""}</td>`).join("");
        return `
          <tr>
            <td>${escapeHtml(item.date)}</td>
            <td><span class="tag ${categoryClass[item.category] || ""}">${escapeHtml(item.category)}</span></td>
            <td class="amount">${money(item.amount)}</td>
            ${categoryColumns}
            <td>${escapeHtml(item.reason)}</td>
            <td>${escapeHtml(item.from)}</td>
            <td>${escapeHtml(item.to)}</td>
            <td class="amount">${numberText(item.mileage)}</td>
            <td>${escapeHtml(item.payment)}</td>
            <td>${escapeHtml(item.receipt)}</td>
            <td>${escapeHtml(item.note)}</td>
            <td>
              <button class="small-btn" type="button" data-action="edit" data-id="${item.id}">编辑</button>
              <button class="small-btn" type="button" data-action="delete" data-id="${item.id}">删除</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function render() {
      const list = getFilteredExpenses();
      renderSummary(list);
      renderCards(list);
      renderTable(list);
    }

    function deleteExpense(id) {
      const item = expenses.find((entry) => entry.id === id);
      if (!item) return;
      if (!confirm(`确定删除这笔 ${item.date} 的 ${item.category} 记录吗？`)) return;
      expenses = expenses.filter((entry) => entry.id !== id);
      saveExpenses();
      render();
    }

    function toCsvValue(value) {
      return `"${String(value ?? "").replace(/"/g, '""')}"`;
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    function exportJson() {
      downloadFile(`旅行费用记账单_${today()}.json`, JSON.stringify(expenses, null, 2), "application/json;charset=utf-8");
    }

    function exportCsv() {
      const headers = ["日期", "分类", "消费金额", ...categories, "开支事由", "从哪", "到哪", "大约里程数", "支付方式", "票据编号/订单号", "备注"];
      const rows = getFilteredExpenses().map((item) => [
        item.date,
        item.category,
        item.amount,
        ...categories.map((category) => item.category === category ? item.amount : ""),
        item.reason,
        item.from,
        item.to,
        item.mileage,
        item.payment,
        item.receipt,
        item.note
      ]);
      const csv = [headers, ...rows].map((row) => row.map(toCsvValue).join(",")).join("\n");
      downloadFile(`旅行费用记账单_${today()}.csv`, "\ufeff" + csv, "text/csv;charset=utf-8");
    }

    function normalizeImported(items) {
      return items.map((item) => ({
        id: item.id || uid(),
        date: item.date || today(),
        category: categories.includes(item.category) ? item.category : "其他消费",
        amount: Number(item.amount || 0),
        payment: item.payment || "其他",
        reason: item.reason || "",
        from: item.from || "",
        to: item.to || "",
        mileage: Number(item.mileage || 0),
        receipt: item.receipt || "",
        note: item.note || "",
        createdAt: item.createdAt || new Date().toISOString(),
        updatedAt: item.updatedAt || new Date().toISOString()
      }));
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const item = readForm();
      if (!item.date || !item.category || item.amount <= 0) {
        alert("请填写日期、分类和大于 0 的消费金额。");
        return;
      }
      if (item.category === "过路费" && (!item.from || !item.to)) {
        if (!confirm("这是一笔过路费，但起点或终点未填写。仍然保存吗？")) return;
      }
      const index = expenses.findIndex((entry) => entry.id === item.id);
      if (index >= 0) expenses[index] = item;
      else expenses.push(item);
      saveExpenses();
      resetForm();
      render();
    });

    document.getElementById("resetBtn").addEventListener("click", resetForm);
    document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);
    document.getElementById("exportJsonBtn").addEventListener("click", exportJson);
    document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("printBtn").addEventListener("click", () => window.print());
    document.getElementById("clearBtn").addEventListener("click", () => {
      if (!expenses.length) return;
      if (!confirm("确定清空全部记账记录吗？建议先导出 JSON 备份。")) return;
      expenses = [];
      saveExpenses();
      resetForm();
      render();
    });

    document.getElementById("importFile").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const imported = JSON.parse(await file.text());
        if (!Array.isArray(imported)) throw new Error("JSON 文件格式不正确，应为记录数组。");
        if (expenses.length && !confirm(`导入 JSON 会覆盖当前 ${expenses.length} 条本地记录。是否继续？`)) return;
        expenses = normalizeImported(imported);
        saveExpenses();
        resetForm();
        render();
      } catch (error) {
        alert(`导入失败：${error.message}`);
      } finally {
        event.target.value = "";
      }
    });

    quickCategoryButtons.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-category]");
      if (!button) return;
      fields.category.value = button.dataset.category;
      updateCategoryUi();
      fields.amount.focus();
    });

    fields.category.addEventListener("change", updateCategoryUi);
    Object.values(filters).forEach((input) => {
      input.addEventListener("input", render);
      input.addEventListener("change", render);
    });

    document.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const item = expenses.find((entry) => entry.id === button.dataset.id);
      if (!item) return;
      if (button.dataset.action === "edit") fillForm(item);
      if (button.dataset.action === "delete") deleteExpense(item.id);
    });

    initStaticUi();
    resetForm();
    render();
  </script>
</body>
</html>
