<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rent Ledger</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f4;color:#1f2933;font-family:"Microsoft YaHei",Arial,sans-serif} .box{padding:22px;border:1px solid #d8ded5;background:#fff;border-radius:8px;max-width:520px;line-height:1.6} .err{color:#b42318;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="box" id="status">Loading rent ledger...</div>
  <script>
    const statusEl = document.getElementById('status');
    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }
    const parts = [
      'bundle.part00.txt', 'bundle.part01.txt', 'bundle.part02.txt', 'bundle.part03.txt', 'bundle.part04.txt',
      'bundle.part05.txt', 'bundle.part06.txt', 'bundle.part07.txt', 'bundle.part08.txt', 'bundle.part09.txt'
    ];
    Promise.all(parts.map(name => fetch(name, { cache: 'no-store' }).then(async r => {
      if (!r.ok) throw new Error(name + ' load failed: ' + r.status);
      return r.text();
    }))).then(async chunks => {
      if (!('DecompressionStream' in window)) throw new Error('Please use a current Chrome, Edge, or Safari browser.');
      const bytes = base64ToBytes(chunks.join('').replace(/\s+/g, ''));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(stream).text();
      document.open();
      document.write(html);
      document.close();
    }).catch(error => {
      statusEl.className = 'box err';
      statusEl.textContent = 'Load failed: ' + error.message + '\nPlease refresh after GitHub Pages finishes deploying.';
    });
  </script>
</body>
</html>
