<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rent Ledger</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f4;color:#1f2933;font-family:"Microsoft YaHei",Arial,sans-serif} .box{padding:22px;border:1px solid #d8ded5;background:#fff;border-radius:8px;max-width:520px;line-height:1.6} .err{color:#b42318;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="box" id="status">Loading rent ledger...</div>
  <script>
    const parts = ["app.part00.txt", "app.part01.txt", "app.part02.txt", "app.part03.txt", "app.part04.txt", "app.part05.txt", "app.part06.txt", "app.part07.txt", "app.part08.txt", "app.part09.txt"];
    const statusEl = document.getElementById('status');
    function fromBase64Utf8(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }
    Promise.all(parts.map(name => fetch(name, { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error(name + ' load failed: ' + r.status);
      return r.text();
    }))).then(chunks => {
      const html = fromBase64Utf8(chunks.join(''));
      document.open();
      document.write(html);
      document.close();
    }).catch(error => {
      statusEl.className = 'box err';
      statusEl.textContent = 'Load failed: ' + error.message + '\nPlease refresh after GitHub Pages finishes deploying.';
    });
  </script>
</body>
</html>
